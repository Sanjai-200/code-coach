<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Code Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6FB;
    --surface: #FFFFFF;
    --surface-2: #FAFAFE;
    --border: #E6E7F2;
    --text: #191A2A;
    --muted: #6B6E85;
    --primary-a: #4F46E5;
    --primary-b: #7C3AED;
    --cyan: #06B6D4;
    --danger: #E1443F;
    --shadow: 0 8px 24px rgba(79,70,229,0.08);
  }
  [data-theme="dark"]{
    --bg: #0B0C14;
    --surface: #14151F;
    --surface-2: #191A26;
    --border: #262838;
    --text: #EDEDF5;
    --muted: #9296AC;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.25s ease, color 0.25s ease;
  }
  .brand-font{ font-family:'Space Grotesk', 'Inter', sans-serif; }

  .orb{
    width:34px; height:34px; border-radius:50%;
    background: conic-gradient(from 180deg, var(--primary-a), var(--cyan), var(--primary-b), var(--primary-a));
    flex-shrink:0;
    position:relative;
    box-shadow: 0 0 0 3px var(--surface), 0 4px 14px rgba(124,58,237,0.35);
  }
  .orb::after{
    content:"";
    position:absolute; inset:5px;
    border-radius:50%;
    background: var(--surface);
  }
  .orb.pulse::after{ animation: pulseInner 1.1s ease-in-out infinite; }
  @keyframes pulseInner{ 0%,100%{ inset:5px; } 50%{ inset:9px; } }
  @media (prefers-reduced-motion: reduce){ .orb.pulse::after{ animation: none; } }

  .app{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  header{
    display:flex; align-items:center; gap:12px;
    padding:14px 22px;
    border-bottom:1px solid var(--border);
    background: var(--surface);
    flex-shrink:0;
  }
  header .name{ font-size:17px; font-weight:700; letter-spacing:-0.01em; }
  .theme-toggle{
    margin-left:auto;
    display:flex; align-items:center; gap:8px;
    background:none; border:1px solid var(--border);
    border-radius:10px; padding:8px 12px;
    color:var(--muted); font-size:13px; cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .theme-toggle:hover{ color:var(--text); border-color:var(--primary-a); }

  .chat-area{ flex:1; overflow-y:auto; padding: 28px 0 8px 0; }
  .chat-inner{ max-width: 780px; margin:0 auto; padding: 0 24px; }

  .empty-state{ max-width:520px; margin: 10vh auto 0 auto; text-align:center; padding: 0 20px; }
  .empty-state .orb{ width:52px; height:52px; margin:0 auto 20px auto; }
  .empty-state h1{ font-size: 26px; margin: 0 0 8px 0; letter-spacing:-0.02em; }
  .empty-state p{ color: var(--muted); font-size:15px; margin:0; }

  .msg{ display:flex; gap:12px; margin-bottom: 26px; align-items:flex-start; }
  .msg.user{ flex-direction:row-reverse; }
  .msg-avatar{ flex-shrink:0; margin-top:2px; }
  .msg-avatar.user-avatar{
    width:34px; height:34px; border-radius:50%;
    background: linear-gradient(135deg, var(--primary-a), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    color:white; font-weight:600; font-size:11px;
  }
  .msg-body{ max-width: 82%; display:flex; flex-direction:column; gap:6px; }
  .msg.user .msg-body{ align-items:flex-end; }
  .bubble{ padding: 12px 16px; border-radius: 16px; font-size:15px; line-height:1.6; word-wrap:break-word; }
  .msg.assistant .bubble{ background: var(--surface); border:1px solid var(--border); border-top-left-radius:4px; }
  .msg.user .bubble{
    background: linear-gradient(135deg, var(--primary-a), var(--primary-b));
    color:white; border-top-right-radius:4px;
  }
  .msg.error .bubble{
    background: rgba(225,68,63,0.08);
    border:1px solid rgba(225,68,63,0.3);
    color: var(--danger);
  }
  .msg-time{ font-size:11px; color:var(--muted); padding: 0 4px; }

  .bubble p{ margin: 0 0 10px 0; } .bubble p:last-child{ margin-bottom:0; }
  .bubble h1, .bubble h2, .bubble h3{ font-family:'Space Grotesk', sans-serif; margin: 10px 0 6px; line-height:1.3; }
  .bubble h1{ font-size:18px; } .bubble h2{ font-size:16.5px; } .bubble h3{ font-size:15.5px; }
  .bubble ul, .bubble ol{ margin: 6px 0; padding-left:22px; }
  .bubble li{ margin: 3px 0; }
  .bubble a{ color: inherit; text-decoration: underline; }
  .bubble .math{ font-family:'JetBrains Mono', monospace; }
  .bubble code{
    font-family:'JetBrains Mono', monospace; font-size:13px;
    background: rgba(124,58,237,0.10); padding:2px 5px; border-radius:5px;
  }
  .msg.user .bubble code{ background: rgba(255,255,255,0.18); }
  .code-block{ position:relative; margin: 10px 0; }
  .code-block pre{
    background:#171826; color:#EDEDF5;
    padding:14px 16px; border-radius:12px;
    overflow-x:auto; font-size:13px; line-height:1.55;
    font-family:'JetBrains Mono', monospace;
    white-space: pre-wrap;
  }
  .code-block pre code{ background:none; padding:0; }
  .copy-btn{
    position:absolute; top:8px; right:8px;
    background: rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:#EDEDF5; border-radius:7px;
    font-size:11px; padding:5px 9px; cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .copy-btn:hover{ background: rgba(255,255,255,0.16); }

  .typing{ display:flex; gap:5px; padding: 6px 4px; }
  .typing span{
    width:7px; height:7px; border-radius:50%;
    background: var(--primary-a);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform: translateY(0); opacity:0.5; } 30%{ transform: translateY(-5px); opacity:1; } }

  .composer-wrap{ border-top:1px solid var(--border); background: var(--bg); padding: 14px 24px 18px 24px; flex-shrink:0; }
  .composer{ max-width:780px; margin:0 auto; }
  .input-row{
    display:flex; align-items:flex-end; gap:8px;
    background: var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding: 8px 8px 8px 16px;
    box-shadow: var(--shadow);
  }
  #messageInput{
    flex:1; border:none; outline:none; resize:none;
    background:transparent; color:var(--text);
    font-family:'Inter', sans-serif; font-size:15px;
    line-height:1.5; max-height:160px; padding:8px 0;
  }
  #messageInput::placeholder{ color: var(--muted); }
  .send-btn{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background: linear-gradient(135deg, var(--primary-a), var(--primary-b));
    color:white; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .send-btn:disabled{ opacity:0.4; cursor:default; }
  .send-btn:active:not(:disabled){ transform: scale(0.92); }

  .composer-hint{ text-align:center; font-size:11.5px; color: var(--muted); margin-top:8px; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:8px; }

  @media (max-width: 600px){
    header{ padding: 12px 16px; }
    .msg-body{ max-width: 90%; }
    .composer-wrap{ padding: 12px 12px 14px 12px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="orb" style="width:28px;height:28px;"></div>
    <div class="name brand-font">Code Coach</div>
    <button class="theme-toggle" id="themeToggle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLabel">Dark mode</span>
    </button>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">
      <div class="empty-state" id="emptyState">
        <div class="orb pulse"></div>
        <h1 class="brand-font">Hi, I'm Code Coach</h1>
        <p>Ask me anything within my domain.</p>
      </div>
      <div id="messages"></div>
    </div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <div class="input-row">
        <textarea id="messageInput" rows="1" placeholder="Message Code Coach..."></textarea>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="composer-hint">Code Coach can make mistakes. Verify important information.</div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // No external JS libraries are used anywhere in this file.
  // Markdown rendering below is hand-written so the chat UI
  // never depends on a CDN being reachable.
  // ============================================================

  const chatArea = document.getElementById('chatArea');
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const themeToggle = document.getElementById('themeToggle');
  const themeLabel = document.getElementById('themeLabel');

  let isSending = false;

  // ---------- Theme ----------
  function applyTheme(mode){
    if(mode === 'dark'){
      document.documentElement.setAttribute('data-theme','dark');
      themeLabel.textContent = 'Light mode';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeLabel.textContent = 'Dark mode';
    }
    localStorage.setItem('chatbot-theme', mode);
  }
  const savedTheme = localStorage.getItem('chatbot-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(savedTheme);
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  // ---------- Composer ----------
  function autoResize(){
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
  }
  function refreshSendState(){
    sendBtn.disabled = isSending || messageInput.value.trim() === '';
  }
  messageInput.addEventListener('input', () => { autoResize(); refreshSendState(); });
  messageInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      if(!sendBtn.disabled) sendMessage();
    }
  });

  // ---------- Minimal, dependency-free markdown renderer ----------
  function escapeHtml(str){
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  const LATEX_LITE = {
    '\\rightarrow': '→', '\\to': '→', '\\leftarrow': '←',
    '\\Rightarrow': '⇒', '\\Leftarrow': '⇐', '\\leftrightarrow': '↔',
    '\\times': '×', '\\cdot': '·', '\\pm': '±', '\\mp': '∓',
    '\\le': '≤', '\\leq': '≤', '\\ge': '≥', '\\geq': '≥', '\\neq': '≠',
    '\\approx': '≈', '\\infty': '∞', '\\sqrt': '√', '\\sum': 'Σ',
    '\\prod': 'Π', '\\in': '∈', '\\notin': '∉', '\\subset': '⊂',
    '\\cup': '∪', '\\cap': '∩', '\\forall': '∀', '\\exists': '∃',
    '\\pi': 'π', '\\alpha': 'α', '\\beta': 'β', '\\gamma': 'γ',
    '\\delta': 'δ', '\\theta': 'θ', '\\lambda': 'λ', '\\mu': 'μ',
    '\\sigma': 'σ', '\\omega': 'ω'
  };

  function convertLatexLite(expr){
    let out = expr;
    for(const [token, symbol] of Object.entries(LATEX_LITE)){
      out = out.split(token).join(symbol);
    }
    return out.trim();
  }

  function renderMarkdown(rawText){
    let text = escapeHtml(rawText);

    const codeBlocks = [];
    text = text.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
      codeBlocks.push(code.replace(/\n$/, ''));
      return `\u0000CB${codeBlocks.length - 1}\u0000`;
    });

    const inlineCode = [];
    text = text.replace(/`([^`\n]+)`/g, (m, code) => {
      inlineCode.push(code);
      return `\u0000IC${inlineCode.length - 1}\u0000`;
    });

    text = text.replace(/\${1,2}([^$\n]+)\${1,2}/g, (m, expr) =>
      `<span class="math">${convertLatexLite(expr)}</span>`
    );

    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

    const lines = text.split('\n');
    let html = '';
    let listType = null;
    let para = [];

    function flushPara(){
      if(para.length){
        html += '<p>' + para.join('<br>') + '</p>';
        para = [];
      }
    }
    function closeList(){
      if(listType){ html += listType === 'ul' ? '</ul>' : '</ol>'; listType = null; }
    }

    for(const rawLine of lines){
      const line = rawLine.trimEnd();
      const headerMatch = line.match(/^(#{1,3})\s+(.*)/);
      const ulMatch = line.match(/^[-*]\s+(.*)/);
      const olMatch = line.match(/^\d+[.)]\s+(.*)/);
      const cbMatch = line.match(/^\u0000CB(\d+)\u0000$/);

      if(cbMatch){
        flushPara(); closeList();
        html += `\u0000CB${cbMatch[1]}\u0000`;
      } else if(headerMatch){
        flushPara(); closeList();
        const level = headerMatch[1].length;
        html += `<h${level}>${headerMatch[2]}</h${level}>`;
      } else if(ulMatch){
        flushPara();
        if(listType === 'ol'){ html += '</ol>'; listType = null; }
        if(listType !== 'ul'){ html += '<ul>'; listType = 'ul'; }
        html += `<li>${ulMatch[1]}</li>`;
      } else if(olMatch){
        flushPara();
        if(listType === 'ul'){ html += '</ul>'; listType = null; }
        if(listType !== 'ol'){ html += '<ol>'; listType = 'ol'; }
        html += `<li>${olMatch[1]}</li>`;
      } else if(line.trim() === ''){
        flushPara(); closeList();
      } else {
        closeList();
        para.push(line);
      }
    }
    flushPara(); closeList();

    html = html.replace(/\u0000CB(\d+)\u0000/g, (m, i) =>
      `<div class="code-block"><pre><code>${codeBlocks[i]}</code></pre><button class="copy-btn" type="button">Copy</button></div>`
    );
    html = html.replace(/\u0000IC(\d+)\u0000/g, (m, i) => `<code>${inlineCode[i]}</code>`);

    return html;
  }

  function bindCopyButtons(container){
    container.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const code = btn.previousElementSibling.innerText;
        navigator.clipboard.writeText(code).then(() => {
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy', 1500);
        });
      });
    });
  }

  // ---------- Message rendering ----------
  function timeNow(){
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function addUserMessage(text){
    emptyState.style.display = 'none';
    const msg = document.createElement('div');
    msg.className = 'msg user';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar user-avatar';
    avatar.textContent = 'You';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text; // plain text only — never parsed as HTML/markdown
    body.appendChild(bubble);

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = timeNow();
    body.appendChild(time);

    msg.appendChild(avatar);
    msg.appendChild(body);
    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function addAssistantTyping(){
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    msg.id = 'typingMsg';

    const avatar = document.createElement('div');
    avatar.className = 'orb pulse msg-avatar';
    avatar.style.width = '30px';
    avatar.style.height = '30px';

    const body = document.createElement('div');
    body.className = 'msg-body';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    body.appendChild(bubble);

    msg.appendChild(avatar);
    msg.appendChild(body);
    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function replaceTypingWithReply(text, isError){
    const typingMsg = document.getElementById('typingMsg');
    if(!typingMsg) return;
    typingMsg.id = '';
    if(isError) typingMsg.classList.add('error');
    const bubble = typingMsg.querySelector('.bubble');
    bubble.innerHTML = renderMarkdown(text);
    bindCopyButtons(bubble);
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = timeNow();
    typingMsg.querySelector('.msg-body').appendChild(time);
    scrollToBottom();
  }

  function scrollToBottom(){
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ---------- Send ----------
  async function sendMessage(){
    const text = messageInput.value.trim();
    if(!text || isSending) return;

    addUserMessage(text);
    messageInput.value = '';
    autoResize();
    isSending = true;
    refreshSendState();
    addAssistantTyping();

    try{
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();

      if(!res.ok || data.error){
        replaceTypingWithReply(data.error || 'Something went wrong. Please try again.', true);
      } else {
        replaceTypingWithReply(data.reply, false);
      }
    } catch(err){
      replaceTypingWithReply('Network error — check your connection and try again.', true);
    } finally {
      isSending = false;
      refreshSendState();
      messageInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  refreshSendState();
</script>
</body>
</html>
